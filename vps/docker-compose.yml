# Homelab cloud services — portable: runs anywhere Docker runs.
# Moving providers = copy this directory + restore the named volumes (see backup.sh).

services:
  uptime-kuma:
    # Pinned to major version 2 (the maintained line; v1 is end-of-life).
    # Picks up 2.x fixes, never a surprise v3 migration.
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # Localhost only. Docker programs iptables directly and bypasses ufw,
      # so a normally-published port would be reachable from the public internet.
      # Kuma reaches the tailnet via `tailscale serve` (see README).
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data

  beszel:
    # Metrics hub: Kuma watches uptime, Beszel watches the machines
    # (CPU / memory / disk / containers) via agents on each host.
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      # Same pattern as Kuma: localhost only (Docker bypasses ufw).
      # The UI reaches the tailnet via a second `tailscale serve` port.
      - "127.0.0.1:8090:8090"
    volumes:
      # Target is /beszel_data (underscore, root level): the current
      # image is a scratch image whose only payload is the binary at
      # /beszel (a file, not a directory), so /beszel/data cannot exist.
      # Verified against the v0.21.1 image contents 2026-10-24 after the
      # first `up` failed with "lstat .../beszel/data: not a directory".
      - beszel-data:/beszel_data

volumes:
  kuma-data:
    # Explicit name: backup.sh / restore.sh find it regardless of project dir name.
    name: kuma-data
  beszel-data:
    # Explicit name, same reasoning as kuma-data.
    name: beszel-data
