# First workload: proves the cluster schedules, networks, and serves.
#
#   kubectl apply -f manifests/demo-whoami.yaml
#   kubectl -n demo port-forward svc/whoami 8080:80
#   curl http://localhost:8080
#
# Then break it on purpose: kubectl -n demo delete pod <name>
# Watch the Deployment recreate it — that's the self-healing lesson.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
