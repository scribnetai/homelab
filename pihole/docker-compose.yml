# Pi-hole v6 stack -- runs inside the pihole VM (see terraform/).
# Deploy path on the VM: ~/pihole/docker-compose.yml
#
# Deliberate choices, do not "fix" them casually:
# - No admin password in this file or any env var. On v6 the old
#   WEBPASSWORD variable does nothing; the supported path is to set
#   the password interactively after first start:
#     docker exec pihole pihole setpassword
#   and store it in the password manager. Secrets never live in git.
# - No NET_ADMIN capability and no port 67: Pi-hole is NOT the DHCP
#   server here. The router keeps DHCP; clients reach Pi-hole by
#   being handed its address as their DNS server (stage 2 -- see
#   README). DHCP mode would need NET_ADMIN + a different network
#   posture.
# - Upstreams are Quad9 (privacy posture, malware filtering) with
#   Cloudflare as second. Change in the admin UI if you re-decide;
#   FTLCONF values below only seed first start.
# - State persists in ./etc-pihole (the whole config is one TOML
#   file on v6, /etc/pihole/pihole.toml, plus gravity's database).
#   The PBS job backing up the VM covers this with it.
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    ports:
      # Port 53 binds ONLY on the VM's LAN address (PIHOLE_BIND_IP,
      # set in the local .env next to this file -- local only, never
      # committed; the doc-range value below is just the fallback).
      # Reason: Ubuntu's systemd-resolved squats on port 53 at BOTH
      # 127.0.0.53 and 127.0.0.54, which collides with a wildcard
      # 0.0.0.0:53 publish. A LAN-address bind never overlaps the
      # loopbacks, so the host resolver needs no surgery and keeps
      # using its own upstream. At re-IP, change the one .env line.
      - "${PIHOLE_BIND_IP:-192.0.2.27}:53:53/tcp"
      - "${PIHOLE_BIND_IP:-192.0.2.27}:53:53/udp"
      # Port 53 ALSO binds on the VM's tailnet address
      # (PIHOLE_TS_BIND_IP, same local .env; the fallback below is
      # a shared-address-space placeholder, never a real tailnet
      # address). Purpose: a tailnet global nameserver must be an
      # address every mesh device can reach -- this lab deliberately
      # does NOT advertise the LAN subnet route, so the LAN bind
      # alone is invisible off-LAN. The console flip that makes
      # devices USE this address is a separate decision (README,
      # Stage T). Boot note: if Docker wins the boot race against
      # tailscaled, this bind can fail and the container will not
      # start -- `docker compose up -d` once tailscaled is up is
      # the fix.
      - "${PIHOLE_TS_BIND_IP:-100.64.0.27}:53:53/tcp"
      - "${PIHOLE_TS_BIND_IP:-100.64.0.27}:53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: "America/New_York"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "9.9.9.9;1.1.1.1"
    volumes:
      - "./etc-pihole:/etc/pihole"
    restart: unless-stopped
