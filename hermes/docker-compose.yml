# Hermes Agent deployment — the deployed file, with the VM's Tailscale
# IP placeholdered for this public repo. Substitute the real tailnet
# IP before use.
services:
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
    deploy:
      resources:
        limits:
          memory: 4G
  hermes-backend:
    image: nousresearch/hermes-agent:stable@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    container_name: hermes-backend
    command: serve --host 0.0.0.0 --port 9119
    restart: unless-stopped
    volumes:
      - ./data:/opt/data
    ports:
      # Tailnet-only: publish the Desktop/dashboard backend on the
      # VM's Tailscale IP, nowhere else.
      - "<vm-tailnet-ip>:9119:9119"
    deploy:
      resources:
        limits:
          memory: 1G
